<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <rect width="1600" height="820" fill="#FBFAF7"/>
  <defs>
    <style>
      .ink{fill:#171918}.muted{fill:#656761}.coral{fill:#EF6252}.pale{fill:#FFF3EF}.mint{fill:#F1F7F4}
      .line{stroke:#EF6252;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .h{font:700 28px Inter,Arial,sans-serif;fill:#171918}.k{font:700 15px Inter,Arial,sans-serif;letter-spacing:1px}
      .b{font:600 20px Inter,Arial,sans-serif;fill:#171918}.s{font:400 16px Inter,Arial,sans-serif;fill:#656761}.tiny{font:600 13px Inter,Arial,sans-serif}
    </style>
  </defs>

  <!-- BEFORE -->
  <text x="360" y="88" text-anchor="middle" class="k" fill="#EF6252">BEFORE · SERVICE-LEVEL</text>
  <text x="360" y="130" text-anchor="middle" class="h">Repeat the same policy across services</text>

  <g transform="translate(90,180)">
    <rect width="540" height="390" rx="24" fill="#fff" stroke="#E9DED8" stroke-width="2"/>
    <g transform="translate(40,46)">
      <text x="0" y="25" class="b">Service A</text>
      <rect x="230" y="0" width="230" height="52" rx="11" fill="#FFF8F5" stroke="#E8D9D3"/>
      <text x="250" y="32" class="s">Delete Service</text>
      <rect x="390" y="13" width="50" height="26" rx="13" fill="#EF6252"/><text x="415" y="31" text-anchor="middle" class="tiny" fill="#fff">ON</text>

      <text x="0" y="126" class="b">Service B</text>
      <rect x="230" y="101" width="230" height="52" rx="11" fill="#FFF8F5" stroke="#E8D9D3"/>
      <text x="250" y="133" class="s">Delete Service</text>
      <rect x="390" y="114" width="50" height="26" rx="13" fill="#EF6252"/><text x="415" y="132" text-anchor="middle" class="tiny" fill="#fff">ON</text>

      <text x="0" y="227" class="b">Service C</text>
      <rect x="230" y="202" width="230" height="52" rx="11" fill="#FFF8F5" stroke="#E8D9D3"/>
      <text x="250" y="234" class="s">Delete Service</text>
      <rect x="390" y="215" width="50" height="26" rx="13" fill="#EF6252"/><text x="415" y="233" text-anchor="middle" class="tiny" fill="#fff">ON</text>
    </g>
    <text x="270" y="350" text-anchor="middle" class="s">Three services → three separate configurations</text>
  </g>

  <!-- CENTER -->
  <g transform="translate(800,355)">
    <circle cx="0" cy="-70" r="42" fill="#FFF3EF" stroke="#F0CFC7"/>
    <g transform="translate(0,-70)" fill="none" stroke="#EF6252" stroke-width="3">
      <circle cx="-10" cy="-7" r="8"/><circle cx="10" cy="-7" r="8"/>
      <path d="M-27 19c2-13 9-20 17-20s15 7 17 20M-7 19c2-13 9-20 17-20s15 7 17 20"/>
    </g>
    <text x="0" y="10" text-anchor="middle" class="k" fill="#EF6252">CUSTOMER FEEDBACK</text>
    <text x="0" y="38" text-anchor="middle" class="s">+ team trade-off</text>
    <path d="M-70 92H70M50 72l22 20-22 20" class="line" stroke-width="5"/>
  </g>

  <!-- AFTER -->
  <text x="1240" y="88" text-anchor="middle" class="k" fill="#277260">AFTER · GLOBAL</text>
  <text x="1240" y="130" text-anchor="middle" class="h">Configure once. Apply consistently.</text>

  <g transform="translate(970,180)">
    <rect width="540" height="390" rx="24" fill="#fff" stroke="#DDE7E1" stroke-width="2"/>
    <rect x="95" y="52" width="350" height="72" rx="14" fill="#F1F7F4" stroke="#CFE0D7"/>
    <text x="125" y="96" class="b">Delete Service</text>
    <rect x="365" y="75" width="50" height="26" rx="13" fill="#277260"/><text x="390" y="93" text-anchor="middle" class="tiny" fill="#fff">ON</text>

    <path d="M270 124v55M110 179h320M110 179v52M270 179v52M430 179v52" fill="none" stroke="#277260" stroke-width="2.5" stroke-dasharray="6 8"/>

    <g transform="translate(110,275)"><rect x="-55" y="-38" width="110" height="76" rx="14" fill="#FFFDFC" stroke="#D9D6D1"/><text x="0" y="7" text-anchor="middle" class="b">Service A</text></g>
    <g transform="translate(270,275)"><rect x="-55" y="-38" width="110" height="76" rx="14" fill="#FFFDFC" stroke="#D9D6D1"/><text x="0" y="7" text-anchor="middle" class="b">Service B</text></g>
    <g transform="translate(430,275)"><rect x="-55" y="-38" width="110" height="76" rx="14" fill="#FFFDFC" stroke="#D9D6D1"/><text x="0" y="7" text-anchor="middle" class="b">Service C</text></g>
    <text x="270" y="350" text-anchor="middle" class="s">One policy → consistent protection</text>
  </g>

  <!-- TAKEAWAY -->
  <rect x="370" y="650" width="860" height="92" rx="20" fill="#171918"/>
  <text x="800" y="708" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Consistency and scalability over maximum configurability</text>
</svg>
