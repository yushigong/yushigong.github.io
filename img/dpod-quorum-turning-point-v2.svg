<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#FBFAF7"/>
  <defs><style>
    .ink{fill:#171918}.muted{fill:#5D605D}.coral{fill:#EF6252}.pale{fill:#FFF3EF}.h{font:700 28px Inter,Arial;fill:#171918}.k{font:700 15px Inter,Arial;fill:#EF6252;letter-spacing:1px}.b{font:600 20px Inter,Arial;fill:#171918}.s{font:400 17px Inter,Arial;fill:#5D605D}.line{stroke:#EF6252;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style></defs>
  <!-- left -->
  <rect x="95" y="110" width="560" height="620" rx="26" fill="#fff" stroke="#EADDD7" stroke-width="2"/>
  <text x="375" y="165" text-anchor="middle" class="k">BEFORE · SERVICE-LEVEL</text>
  <text x="375" y="215" text-anchor="middle" class="h">Three services. Three configurations.</text>
  <g transform="translate(155,300)">
    <rect x="0" y="0" width="440" height="95" rx="16" fill="#FFF8F5" stroke="#EADDD7"/><text x="28" y="42" class="b">Service A</text><text x="230" y="42" class="s">Delete Service</text><rect x="350" y="24" width="60" height="30" rx="15" fill="#EF6252"/><text x="380" y="45" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fff">ON</text>
    <rect x="0" y="125" width="440" height="95" rx="16" fill="#FFF8F5" stroke="#EADDD7"/><text x="28" y="167" class="b">Service B</text><text x="230" y="167" class="s">Delete Service</text><rect x="350" y="149" width="60" height="30" rx="15" fill="#D8D6D2"/><text x="380" y="170" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#5D605D">OFF</text>
    <rect x="0" y="250" width="440" height="95" rx="16" fill="#FFF8F5" stroke="#EADDD7"/><text x="28" y="292" class="b">Service C</text><text x="230" y="292" class="s">Delete Service</text><rect x="350" y="274" width="60" height="30" rx="15" fill="#EF6252"/><text x="380" y="295" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fff">ON</text>
  </g>
  <text x="375" y="690" text-anchor="middle" class="s">Same operation, different rules across services</text>

  <!-- center -->
  <path d="M720 420h155M845 390l35 30-35 30" class="line" stroke-width="5"/>
  <circle cx="800" cy="335" r="44" fill="#FFF3EF" stroke="#F2CFC7"/>
  <g transform="translate(800 335)" fill="none" stroke="#EF6252" stroke-width="3"><circle cx="-9" cy="-6" r="9"/><circle cx="10" cy="-6" r="9"/><path d="M-26 20c2-14 9-21 17-21s15 7 17 21M-7 20c2-14 9-21 17-21s15 7 17 21"/></g>
  <text x="800" y="505" text-anchor="middle" class="k">CUSTOMER RESEARCH</text>
  <text x="800" y="535" text-anchor="middle" class="s">+ PM / Engineering trade-off</text>

  <!-- right -->
  <rect x="945" y="110" width="560" height="620" rx="26" fill="#fff" stroke="#EADDD7" stroke-width="2"/>
  <text x="1225" y="165" text-anchor="middle" class="k">AFTER · GLOBAL</text>
  <text x="1225" y="215" text-anchor="middle" class="h">One policy. Consistent protection.</text>
  <rect x="1045" y="292" width="360" height="88" rx="17" fill="#FFF3EF" stroke="#F0CFC7" stroke-width="2"/>
  <text x="1080" y="345" class="b">Delete Service</text>
  <rect x="1315" y="316" width="60" height="30" rx="15" fill="#EF6252"/><text x="1345" y="337" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#fff">ON</text>
  <path d="M1225 380v72M1065 452h320M1065 452v60M1225 452v60M1385 452v60" class="line" stroke-dasharray="6 8"/>
  <g transform="translate(1065,555)"><rect x="-55" y="-43" width="110" height="86" rx="15" fill="#FFFDFC" stroke="#DCD7D1" stroke-width="2"/><text x="0" y="8" text-anchor="middle" class="b">Service A</text></g>
  <g transform="translate(1225,555)"><rect x="-55" y="-43" width="110" height="86" rx="15" fill="#FFFDFC" stroke="#DCD7D1" stroke-width="2"/><text x="0" y="8" text-anchor="middle" class="b">Service B</text></g>
  <g transform="translate(1385,555)"><rect x="-55" y="-43" width="110" height="86" rx="15" fill="#FFFDFC" stroke="#DCD7D1" stroke-width="2"/><text x="0" y="8" text-anchor="middle" class="b">Service C</text></g>
  <text x="1225" y="690" text-anchor="middle" class="s">Configure once → apply consistently across services</text>

  <!-- takeaway -->
  <rect x="390" y="780" width="820" height="80" rx="20" fill="#171918"/>
  <text x="800" y="831" text-anchor="middle" font-family="Inter,Arial" font-size="28" font-weight="700" fill="#FFFFFF">Global by scope. Selective by operation.</text>
</svg>
