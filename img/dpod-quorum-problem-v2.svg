  <path d="M1187 723l8 9 8-9" class="line"/>
  <rect x="1105" y="740" rx="13" width="180" height="54" fill="#171918"/>
  <text x="1195" y="775" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#fff">EXECUTE</text>
