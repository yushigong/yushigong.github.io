<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#FBFAF7"/>
  <defs>
    <style>
      .ink{fill:#171918}.muted{fill:#5D605D}.coral{fill:#EF6252}.soft{fill:#FFF3EF}.line{stroke:#EF6252;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.grayline{stroke:#CFCBC6;stroke-width:2;fill:none}.txt{font-family:Inter,Arial,sans-serif}.h{font:700 30px Inter,Arial,sans-serif;fill:#171918}.k{font:700 18px Inter,Arial,sans-serif;fill:#EF6252;letter-spacing:1.2px}.b{font:600 22px Inter,Arial,sans-serif;fill:#171918}.s{font:400 18px Inter,Arial,sans-serif;fill:#5D605D}.cap{font:600 18px Inter,Arial,sans-serif;fill:#171918}
    </style>
  </defs>
  <!-- cards -->
  <rect x="80" y="95" rx="28" ry="28" width="650" height="710" fill="#FFFDFC" stroke="#F2D8D1" stroke-width="2"/>
