  <g transform="translate(1275,625)"><circle cx="0" cy="0" r="22" fill="none" stroke="#171918" stroke-width="3"/><path d="M-38 65c4-28 18-41 38-41s34 13 38 41" fill="none" stroke="#171918" stroke-width="3"/></g>
