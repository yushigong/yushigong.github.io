  <g transform="translate(560,270)"><circle cx="0" cy="0" r="24" fill="none" stroke="#171918" stroke-width="3"/><path d="M-42 70c4-30 20-44 42-44s38 14 42 44" fill="none" stroke="#171918" stroke-width="3"/></g>
  <path d="M250 362v45M405 362v45M560 362v45M250 407h310M405 407v52" class="line" stroke-dasharray="6 9"/>
